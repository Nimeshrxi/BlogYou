{% extends "posts/base.html" %}

{% block bodycontent %}

<h1>Delete Posts</h1>

<p>Are you sure you want to delete "{{ post.title }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>

<a href="{% url 'post_detail' post.id %}">Cancel</a>

{% endblock %}
