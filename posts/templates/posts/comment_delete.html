{% extends "posts/base.html" %}

{% block bodycontent %}

<h1>Delete Comment</h1>
<p>
    Are you sure you want to delete this comment?
</p>

<p>
    "{{ comment.content }}"
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>

<a href="{% url 'post_detail' comment.post.id %}">Cancel</a>
{% endblock %}
