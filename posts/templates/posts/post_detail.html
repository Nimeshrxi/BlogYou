{% extends "posts/base.html" %}

{% block bodycontent %}
    <div class="post">
    <h1>{{ post.title }}</h1>
    <p class="meta">By {{ post.author.username }}</p>
    <p>{{ post.content }}</p>
    <p class="meta">Published on {{ post.created_at|date:"F j, Y, g:i A" }}</p>

    <a class="back-link" href="{% url 'post_list' %}">Back to Posts</a>
    </div>
{% endblock %}
