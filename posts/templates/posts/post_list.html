{% extends "posts/base.html" %}

{% block bodycontent %}
{% if posts %}
    <div class="posts-container">
    {% for post in posts %}
        <div class="post">
            <h2><a href="{% url 'post_detail' post.id %}">{{ post.title }}</a></h2>
            <p class="meta">{{ post.author.username}}</p>
            <p>{{ post.content|truncatewords:10 }}</p>
            <p class="meta">Published on {{ post.created_at|date:"F j, Y" }}</p>
        </div>
    {% endfor %}
    </div>
{% else %}
    No posts yet.
{% endif %}

{% endblock %}
